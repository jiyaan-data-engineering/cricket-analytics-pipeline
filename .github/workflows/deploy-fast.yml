name: 🚀 FAST Deploy (Skip Security Checks)

on:
  push:
    tags:
      - 'fast-v*.*.*'

env:
  TERRAFORM_VERSION: 1.5.0
  GCP_REGION: us-central1
  ENVIRONMENT: prod

jobs:
  validate:
    name: ⚡ Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 📋 Terraform Format & Validate
        working-directory: infrastructure/terraform
        run: |
          echo "Formatting Terraform..."
          terraform fmt -recursive .
          echo "Validating Terraform..."
          terraform init -backend=false
          terraform validate
          echo "✅ Validation passed"

      - name: 📧 Validation Complete
        run: |
          echo ""
          echo "✅ TERRAFORM VALIDATION PASSED"
          echo ""
          echo "Next steps to deploy:"
          echo ""
          echo "1. Create terraform.tfvars:"
          echo "   cp infrastructure/terraform/terraform.tfvars.example \\"
          echo "      infrastructure/terraform/terraform.tfvars"
          echo ""
          echo "2. Edit terraform.tfvars with YOUR values:"
          echo "   gcp_project_id = \"your-project\""
          echo "   gcp_region = \"us-central1\""
          echo "   ... etc"
          echo ""
          echo "3. Deploy locally:"
          echo "   cd infrastructure/terraform"
          echo "   terraform init"
          echo "   terraform plan"
          echo "   terraform apply"
          echo ""
          echo "✨ All Terraform configuration is valid!"
