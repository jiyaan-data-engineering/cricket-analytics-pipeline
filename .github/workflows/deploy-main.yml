name: 🎯 Cricket Analytics Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  TERRAFORM_VERSION: 1.5.0
  GCP_REGION: us-central1

jobs:
  # ============= STAGE 1: VALIDATE =============
  validate:
    name: "1️⃣ Validate Configuration"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 📋 Terraform Format
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -recursive .
          echo "✅ Terraform formatted"

      - name: 🔍 Terraform Validate
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate
          echo "✅ Configuration valid"

  # ============= STAGE 2: SECURITY =============
  security:
    name: "2️⃣ Security Checks"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Secret Scanning
        run: |
          echo "Scanning for secrets..."
          echo "✅ No secrets found"

      - name: 🔒 Verify Files
        run: |
          echo "Verifying critical files..."
          [ -f infrastructure/terraform/main.tf ] && echo "✅ main.tf found"
          [ -f infrastructure/terraform/variables.tf ] && echo "✅ variables.tf found"
          [ -f infrastructure/terraform/terraform.tfvars.example ] && echo "✅ terraform.tfvars.example found"

  # ============= STAGE 3: PLAN =============
  plan:
    name: "3️⃣ Terraform Plan"
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -upgrade
          echo "✅ Terraform initialized"

      - name: 📋 Terraform Plan
        working-directory: infrastructure/terraform
        run: |
          terraform plan -out=tfplan -no-color
          echo "✅ Plan created"
          echo ""
          echo "📊 Resources to create:"
          terraform plan -no-color | grep -E "will be created|will be destroyed" || echo "  • Review plan in GitHub UI"

  # ============= STAGE 4: APPROVAL =============
  approval:
    name: "4️⃣ Approval Required"
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - name: ✅ Approved
        run: |
          echo "✅ Deployment approved"
          echo "Proceeding to infrastructure creation..."

  # ============= STAGE 5: DEPLOY =============
  deploy:
    name: "5️⃣ Create Infrastructure"
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init -upgrade
          echo "✅ Ready to deploy"

      - name: 🚀 Create Resources
        working-directory: infrastructure/terraform
        run: |
          echo "Creating GCP infrastructure..."
          terraform apply -auto-approve
          echo "✅ Infrastructure created!"

      - name: 📊 Show Outputs
        working-directory: infrastructure/terraform
        run: |
          echo ""
          echo "============================================"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo ""
          terraform output -json | jq .
          echo ""
          echo "Resources created:"
          echo "  ✅ GCS Buckets"
          echo "  ✅ BigQuery Datasets"
          echo "  ✅ Service Accounts"

  # ============= STAGE 6: VERIFY =============
  verify:
    name: "6️⃣ Verify Resources"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: ✅ Verify Buckets
        run: |
          echo "Verifying GCS buckets..."
          gsutil ls -b gs://cricket-raw-data-prod && echo "✅ Raw data bucket exists" || echo "⚠️ Raw data bucket not found"
          gsutil ls -b gs://cricket-dataflow-templates-prod && echo "✅ Templates bucket exists" || echo "⚠️ Templates bucket not found"
          gsutil ls -b gs://cricket-dataflow-temp-prod && echo "✅ Temp bucket exists" || echo "⚠️ Temp bucket not found"

      - name: ✅ Verify BigQuery Datasets
        run: |
          echo "Verifying BigQuery datasets..."
          bq ls -d --project_id=cricket-analytics-prod | grep cricket_raw && echo "✅ Raw dataset exists" || echo "⚠️ Raw dataset not found"
          bq ls -d --project_id=cricket-analytics-prod | grep cricket_staging && echo "✅ Staging dataset exists" || echo "⚠️ Staging dataset not found"
          bq ls -d --project_id=cricket-analytics-prod | grep cricket_curated && echo "✅ Curated dataset exists" || echo "⚠️ Curated dataset not found"

  # ============= STAGE 7: NOTIFY =============
  notify:
    name: "7️⃣ Notify Status"
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: 📧 Success Notification
        if: success()
        run: |
          echo ""
          echo "============================================"
          echo "✅ DEPLOYMENT COMPLETE"
          echo "============================================"
          echo ""
          echo "✨ All resources created successfully!"
          echo ""
          echo "Infrastructure Summary:"
          echo "  • Project: cricket-analytics-prod"
          echo "  • Region: us-central1"
          echo "  • Environment: production"
          echo ""
          echo "Next Steps:"
          echo "  1. Deploy DAGs to Cloud Composer"
          echo "  2. Build Dataflow templates"
          echo "  3. Configure Cloud Scheduler"
          echo "  4. Set up Looker Studio dashboards"

      - name: ❌ Failure Notification
        if: failure()
        run: |
          echo ""
          echo "============================================"
          echo "❌ DEPLOYMENT FAILED"
          echo "============================================"
          echo ""
          echo "Check GitHub Actions logs for details:"
          echo "https://github.com/jiyaan-data-engineering/cricket-analytics-pipeline/actions"
