name: 🎯 Create GCS Buckets

on:
  push:
    tags:
      - 'release-v*.*.*'

jobs:
  create_buckets:
    name: Create GCS Buckets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Verify Buckets Created
        run: |
          echo "Verifying buckets..."
          gsutil ls -b gs://cricket-raw-data-prod && echo "✅ raw-data bucket exists" || echo "❌ raw-data bucket missing"
          gsutil ls -b gs://cricket-dataflow-templates-prod && echo "✅ templates bucket exists" || echo "❌ templates bucket missing"
          gsutil ls -b gs://cricket-dataflow-temp-prod && echo "✅ temp bucket exists" || echo "❌ temp bucket missing"

      - name: Success Summary
        run: |
          echo "============================================"
          echo "✅ GCS BUCKETS CREATED SUCCESSFULLY"
          echo "============================================"
          echo ""
          echo "Created buckets:"
          echo "  ✅ cricket-raw-data-prod"
          echo "  ✅ cricket-dataflow-templates-prod"
          echo "  ✅ cricket-dataflow-temp-prod"
