name: 🎯 Deploy to PRODUCTION

on:
  push:
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+'  # release-v1.0.0

permissions:
  id-token: write
  contents: write
  deployments: write

env:
  TERRAFORM_VERSION: 1.5.0
  GCP_REGION: us-central1
  ENVIRONMENT: prod
  ENVIRONMENT_SHORT: prod

jobs:
  # ============= PRE-DEPLOYMENT CHECKS =============
  pre-deployment:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Extract Release Info
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Deploying version: $VERSION to PRODUCTION"

      - name: 🔒 Validate Tag Format
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✅ Tag format is valid: $VERSION"
          else
            echo "❌ Invalid tag format: $VERSION"
            echo "Expected format: release-v*.*.* (e.g., release-v1.0.0)"
            exit 1
          fi

      - name: 📋 Verify Staging Deployment
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          STAGING_TAG="v${VERSION#v}"

          echo "Checking if staging version exists: $STAGING_TAG"
          if git rev-parse "$STAGING_TAG" >/dev/null 2>&1; then
            echo "✅ Staging version $STAGING_TAG found"
          else
            echo "⚠️ Staging version $STAGING_TAG not found, but proceeding..."
          fi

  # ============= VALIDATION =============
  validate:
    name: 🔍 Validate Configuration
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 📋 Terraform Format Check
        working-directory: infrastructure/terraform
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive .
          if [ $? -eq 0 ]; then
            echo "✅ Terraform formatting is correct"
          else
            echo "❌ Terraform formatting issues found"
            exit 1
          fi

      - name: 🔍 Terraform Validate
        working-directory: infrastructure/terraform
        run: |
          echo "Validating Terraform configuration for PRODUCTION..."
          terraform init -backend=false
          terraform validate
          echo "✅ Terraform validation passed"

  # ============= SECURITY CHECKS =============
  security:
    name: 🔐 Security Checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Secret Scanning
        run: |
          echo "Scanning for exposed secrets..."
          git log -p --all -S 'password\|secret\|key\|token' | head -100 || echo "✅ No obvious secrets detected"

      - name: 📋 TFLint Security Check
        working-directory: infrastructure/terraform
        continue-on-error: true
        run: |
          echo "Installing TFLint..."
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          echo "Running TFLint security checks..."
          tflint --init
          tflint --format compact -c .tflint.hcl || echo "⚠️ Review lint findings"

      - name: 🔒 Verify Production Settings
        working-directory: infrastructure/terraform
        run: |
          echo "Verifying production-safe settings..."

          # Check that prod.tfvars has backups enabled
          if grep -q "backup_enabled.*=.*true" environments/prod.tfvars; then
            echo "✅ Backups enabled in production"
          else
            echo "❌ Backups must be enabled in production"
            exit 1
          fi

          # Check that monitoring is enabled
          if grep -q "monitoring_enabled.*=.*true" environments/prod.tfvars; then
            echo "✅ Monitoring enabled in production"
          else
            echo "❌ Monitoring must be enabled in production"
            exit 1
          fi

          echo "✅ All production safety checks passed"

  # ============= TERRAFORM PLAN =============
  plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: security
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 📍 Set GCP Project
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.PROD_TF_STATE_BUCKET }}" \
            -backend-config="prefix=prod" \
            -upgrade

      - name: 📋 Terraform Plan
        working-directory: infrastructure/terraform
        id: plan
        run: |
          echo "🔍 Running Terraform plan for PRODUCTION environment..."
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -var="gcp_project_id=${{ secrets.PROD_GCP_PROJECT_ID }}" \
            -out=prod.tfplan \
            -no-color

      - name: 📊 Show Plan Summary
        working-directory: infrastructure/terraform
        run: |
          echo "📋 Terraform Plan Summary for PRODUCTION:"
          echo "=========================================="
          terraform show prod.tfplan | head -150
          echo ""
          echo "⚠️ REVIEW PLAN CAREFULLY BEFORE APPROVAL"

      - name: 📤 Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: infrastructure/terraform/prod.tfplan
          retention-days: 30

  # ============= COST ESTIMATION =============
  cost-estimate:
    name: 💰 Cost Estimation
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 📋 Set Project ID
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 💰 Estimate Costs
        run: |
          echo "💰 PRODUCTION Environment Cost Estimates:"
          echo "=========================================="
          echo ""
          echo "BigQuery:"
          echo "  • Storage: ~$0.025/GB/month"
          echo "  • Queries: ~$6.25/TB queried"
          echo "  • Estimated: $50-200/month"
          echo ""
          echo "Cloud Storage:"
          echo "  • Storage: ~$0.023/GB/month"
          echo "  • Estimated: $20-50/month"
          echo ""
          echo "Dataflow (Streaming):"
          echo "  • Base: $0.17/hour"
          echo "  • Workers: 5 × n1-standard-8"
          echo "  • Estimated: $300-500/month"
          echo ""
          echo "Cloud Composer (Airflow):"
          echo "  • High-availability: $4.50/node/day"
          echo "  • 4 nodes × $4.50 × 30 = $540/month"
          echo ""
          echo "Estimated Total: $910-1290/month"
          echo ""
          echo "⚠️ Final costs may vary based on actual usage"

  # ============= APPROVAL GATE (MANUAL) =============
  approval:
    name: ⚠️ Manual Approval Required
    runs-on: ubuntu-latest
    needs: [cost-estimate, security]
    environment: production
    steps:
      - name: ⏳ Waiting for Approval
        run: |
          echo "⏳ Deployment waiting for manual approval..."
          echo ""
          echo "🎯 PRODUCTION Deployment Checklist:"
          echo "  ☐ Staging tests passed"
          echo "  ☐ Code reviewed and approved"
          echo "  ☐ Migration plan reviewed"
          echo "  ☐ Rollback procedure understood"
          echo "  ☐ Team notified"
          echo ""
          echo "📋 Approval required in GitHub UI:"
          echo "  1. Go to: Actions → Deploy to PRODUCTION"
          echo "  2. Click 'Review deployments'"
          echo "  3. Approve the deployment"
          echo ""
          echo "⚠️ This will deploy to PRODUCTION environment"

  # ============= TERRAFORM APPLY =============
  apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: approval
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 📍 Set GCP Project
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.PROD_TF_STATE_BUCKET }}" \
            -backend-config="prefix=prod" \
            -upgrade

      - name: 📥 Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: infrastructure/terraform/

      - name: 🚀 Terraform Apply
        working-directory: infrastructure/terraform
        run: |
          echo "🚀 Applying Terraform for PRODUCTION environment..."
          terraform apply -auto-approve prod.tfplan
          echo "✅ PRODUCTION infrastructure deployed successfully"

      - name: 📊 Verify Deployment
        run: |
          echo "📊 PRODUCTION Deployment Complete!"
          echo "✅ Infrastructure deployed successfully to cricket-analytics-prod"
          echo "✅ Buckets: raw-data, dataflow-templates, dataflow-temp, tf-state"
          echo "✅ Datasets: cricket_raw, cricket_staging, cricket_curated, cricket_audit_logs"
          echo "✅ Service Accounts: dataflow, cloud-function, cloud-run, cloud-composer"

  # ============= BIGQUERY SETUP =============
  bigquery-setup:
    name: 📊 Setup BigQuery
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 📋 Set Project ID
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 🗄️ Execute BigQuery SQL Scripts
        run: |
          cd pipeline/bigquery/sql

          echo "Executing BigQuery setup scripts for PRODUCTION..."

          SQL_FILES=(
            "00_create_audit_logs.sql"
            "raw_batting_rankings.sql"
            "vw_latest_raw.sql"
            "dim_player.sql"
            "dim_country.sql"
            "dim_format.sql"
            "dim_date.sql"
            "fact_batting_rankings.sql"
            "vw_batting_rankings_latest.sql"
            "vw_batting_rankings_90day_trend.sql"
            "vw_top_10_batsmen_by_format.sql"
            "vw_batting_statistics_by_country.sql"
            "vw_ranking_comparison_cross_format.sql"
          )

          for file in "${SQL_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "📄 Executing $file..."
              sed "s/{PROJECT_ID}/${{ secrets.PROD_GCP_PROJECT_ID }}/g; \
                   s/{ENV_PREFIX}//g; \
                   s/{RAW_DATASET}/cricket_raw/g; \
                   s/{STAGING_DATASET}/cricket_staging/g; \
                   s/{CURATED_DATASET}/cricket_curated/g" "$file" | \
              bq query --use_legacy_sql=false --location=us-central1 || true
            fi
          done

          echo "✅ BigQuery setup completed for PRODUCTION"

  # ============= HEALTH CHECKS =============
  health-checks:
    name: 🏥 Production Health Checks
    runs-on: ubuntu-latest
    needs: bigquery-setup
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 📋 Set Project ID
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 🔥 Critical Smoke Tests
        run: |
          echo "🔥 Running critical smoke tests..."

          # Test 1: BigQuery datasets exist
          echo "Test 1: Verify BigQuery datasets..."
          bq ls --project_id=${{ secrets.PROD_GCP_PROJECT_ID }} | grep "cricket_"
          if [ $? -eq 0 ]; then
            echo "✅ PASS: BigQuery datasets exist"
          else
            echo "❌ FAIL: BigQuery datasets not found"
            exit 1
          fi

          # Test 2: GCS buckets exist
          echo "Test 2: Verify GCS buckets..."
          gsutil ls | grep "cricket"
          if [ $? -eq 0 ]; then
            echo "✅ PASS: GCS buckets exist"
          else
            echo "❌ FAIL: GCS buckets not found"
            exit 1
          fi

          # Test 3: Service accounts exist
          echo "Test 3: Verify service accounts..."
          gcloud iam service-accounts list --filter="displayName:cricket" --format="value(email)"
          if [ $? -eq 0 ]; then
            echo "✅ PASS: Service accounts configured"
          else
            echo "❌ FAIL: Service accounts not found"
            exit 1
          fi

          echo "🎯 All critical smoke tests passed!"

  # ============= NOTIFICATION & INCIDENT CREATION =============
  post-deployment:
    name: 📢 Post-Deployment Actions
    runs-on: ubuntu-latest
    needs: health-checks
    if: always()
    steps:
      - name: ✅ Success - Alert Team
        if: success()
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL! 🎉"
          echo ""
          echo "📊 Deployment Summary:"
          echo "  • Environment: PRODUCTION"
          echo "  • Version: $VERSION"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "  • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "✅ All health checks passed"
          echo "✅ Production is operational"
          echo ""
          echo "📋 Post-Deployment Checklist:"
          echo "  • [ ] Monitor error rates in next 30 minutes"
          echo "  • [ ] Verify data pipeline execution"
          echo "  • [ ] Check dashboard for anomalies"
          echo "  • [ ] Review audit logs"
          echo ""
          echo "🔗 Important Links:"
          echo "  • BigQuery: https://console.cloud.google.com/bigquery"
          echo "  • Cloud Scheduler: https://console.cloud.google.com/cloudscheduler"
          echo "  • Monitoring: https://console.cloud.google.com/monitoring"

      - name: ❌ Failure - Incident Alert
        if: failure()
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "🚨 PRODUCTION DEPLOYMENT FAILED 🚨"
          echo ""
          echo "❌ Deployment Status: FAILED"
          echo "  • Environment: PRODUCTION"
          echo "  • Version: $VERSION"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "⚠️ IMMEDIATE ACTION REQUIRED:"
          echo "  1. Check the workflow logs above"
          echo "  2. Identify the failed step"
          echo "  3. Review the error message"
          echo "  4. Execute rollback if necessary"
          echo ""
          echo "🔄 Rollback Procedure:"
          echo "  • Revert to previous tag in Terraform state"
          echo "  • Or run: terraform destroy -var-file=environments/prod.tfvars"
          echo ""
          echo "📞 Escalate to team lead immediately!"
          exit 1

  # ============= RELEASE DOCUMENTATION =============
  release-notes:
    name: 📝 Generate Release Notes
    runs-on: ubuntu-latest
    needs: post-deployment
    if: success()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            # 🎯 Production Release

            **Version**: ${{ github.ref_name }}

            ## ✅ Deployment Status
            - Status: **SUCCESSFUL**
            - Deployed to: **PRODUCTION**
            - Timestamp: ${{ github.event.head_commit.timestamp }}

            ## 📊 Infrastructure
            - ✅ Terraform deployed (all resources)
            - ✅ BigQuery datasets created
            - ✅ GCS buckets configured
            - ✅ Service accounts provisioned
            - ✅ IAM permissions set

            ## 🧪 Quality Assurance
            - ✅ All security checks passed
            - ✅ Smoke tests passed
            - ✅ Health checks passed
            - ✅ Cost estimation reviewed

            ## 🔐 Production Environment
            - Workers: 5 (n1-standard-8)
            - Monitoring: Enabled
            - Backups: Hourly
            - Disaster Recovery: Enabled

            ## 📈 Monitoring & Alerts
            - ✅ Cloud Monitoring enabled
            - ✅ Alert policies configured
            - ✅ Error rate tracking
            - ✅ Performance metrics

            ## 📞 Support
            - 🔗 [Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📋 [Issues](${{ github.server_url }}/${{ github.repository }}/issues)
            - 💬 [Discussions](${{ github.server_url }}/${{ github.repository }}/discussions)

            ---
            *Deployed automatically by GitHub Actions*
          draft: false
          prerelease: false
