name: 🎯 Deploy GCS Buckets

on:
  push:
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write

env:
  TERRAFORM_VERSION: 1.5.0

jobs:
  # ============= STAGE 1: VALIDATE =============
  validate:
    name: 1️⃣ Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 📋 Format & Validate
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -recursive .
          terraform init -backend=false
          terraform validate
          echo "✅ Terraform valid"

  # ============= STAGE 2: PLAN =============
  plan:
    name: 2️⃣ Plan (GCS Buckets)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init

      - name: 📋 Terraform Plan
        working-directory: infrastructure/terraform
        run: |
          terraform plan -out=tfplan
          echo ""
          echo "✅ Plan created"

      - name: 📊 Show Plan
        working-directory: infrastructure/terraform
        run: |
          echo ""
          echo "=========================================="
          echo "📋 TERRAFORM PLAN (GCS BUCKETS ONLY)"
          echo "=========================================="
          echo ""
          terraform show -no-color tfplan | head -50
          echo ""
          echo "Resources to create:"
          echo "  ✅ GCS Bucket: cricket-raw-data-prod"
          echo "  ✅ GCS Bucket: cricket-dataflow-templates-prod"
          echo "  ✅ GCS Bucket: cricket-dataflow-temp-prod"

  # ============= STAGE 3: APPROVAL =============
  approval:
    name: 3️⃣ Approval
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: ⏳ Waiting for Approval
        run: |
          echo ""
          echo "⏳ AWAITING APPROVAL"
          echo ""
          echo "To approve:"
          echo "  1. Go to GitHub Actions"
          echo "  2. Click this workflow"
          echo "  3. Click 'Review deployments'"
          echo "  4. Click 'Approve and deploy'"
          echo ""

  # ============= STAGE 4: APPLY =============
  apply:
    name: 4️⃣ Apply (Create Buckets)
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init

      - name: 🚀 Terraform Apply
        working-directory: infrastructure/terraform
        run: |
          echo ""
          echo "🚀 CREATING GCS BUCKETS..."
          echo ""
          terraform apply -auto-approve
          echo ""
          echo "✅ BUCKETS CREATED!"

      - name: 📊 Show Outputs
        working-directory: infrastructure/terraform
        run: |
          echo ""
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE!"
          echo "=========================================="
          echo ""
          echo "Created buckets:"
          terraform output -json buckets_created | jq .
          echo ""
          echo "Outputs:"
          terraform output
          echo ""

  # ============= STAGE 5: VERIFY =============
  verify:
    name: 5️⃣ Verify
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - name: 🔐 Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: ✅ Verify Buckets Exist
        run: |
          echo ""
          echo "=========================================="
          echo "✅ VERIFYING GCS BUCKETS"
          echo "=========================================="
          echo ""

          if gsutil ls -b gs://cricket-raw-data-prod &>/dev/null; then
            echo "✅ cricket-raw-data-prod EXISTS"
          else
            echo "❌ cricket-raw-data-prod NOT FOUND"
            exit 1
          fi

          if gsutil ls -b gs://cricket-dataflow-templates-prod &>/dev/null; then
            echo "✅ cricket-dataflow-templates-prod EXISTS"
          else
            echo "❌ cricket-dataflow-templates-prod NOT FOUND"
            exit 1
          fi

          if gsutil ls -b gs://cricket-dataflow-temp-prod &>/dev/null; then
            echo "✅ cricket-dataflow-temp-prod EXISTS"
          else
            echo "❌ cricket-dataflow-temp-prod NOT FOUND"
            exit 1
          fi

          echo ""
          echo "✅ All buckets verified!"

  # ============= STAGE 6: SUMMARY =============
  summary:
    name: 6️⃣ Summary
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: 📢 Deployment Summary
        run: |
          echo ""
          echo "✅✅✅ DEPLOYMENT SUCCESSFUL ✅✅✅"
          echo ""
          echo "=========================================="
          echo "🎯 GCS BUCKETS CREATED"
          echo "=========================================="
          echo ""
          echo "Buckets:"
          echo "  ✅ cricket-raw-data-prod"
          echo "  ✅ cricket-dataflow-templates-prod"
          echo "  ✅ cricket-dataflow-temp-prod"
          echo ""
          echo "Location: us-central1"
          echo "Project: cricket-analytics-prod"
          echo ""
          echo "Next steps:"
          echo "  1. Upload CSV files to cricket-raw-data-prod"
          echo "  2. Build Dataflow templates"
          echo "  3. Setup BigQuery datasets"
          echo "  4. Configure Cloud Scheduler"
          echo ""
          echo "=========================================="
