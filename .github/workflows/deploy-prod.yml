name: 🚀 Deploy to PRODUCTION

on:
  push:
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: 1.5.0
  GCP_REGION: us-central1
  ENVIRONMENT: production
  ENVIRONMENT_SHORT: prod

jobs:
  # ============= PRE-DEPLOYMENT VALIDATION =============
  pre-deployment:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Extract Release Info
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Deploying version: $VERSION to PRODUCTION"

      - name: 🔒 Validate Tag Format
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✅ Tag format is valid: $VERSION"
          else
            echo "❌ Invalid tag format: $VERSION"
            echo "Expected format: release-v*.*.* (e.g., release-v1.0.0)"
            exit 1
          fi

  # ============= VALIDATE CONFIGURATION =============
  validate:
    name: ✅ Validate Configuration
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔍 Terraform Validate
        working-directory: infrastructure/terraform
        run: |
          echo "Validating Terraform configuration for PRODUCTION..."
          terraform init -backend=false
          terraform validate
          echo "✅ Terraform validation passed"

  # ============= TERRAFORM PLAN =============
  plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🪣 Create Terraform State Bucket
        run: |
          BUCKET="cricket-analytics-prod-tfstate"
          if gsutil ls -b gs://$BUCKET &>/dev/null; then
            echo "✅ State bucket already exists: $BUCKET"
          else
            echo "📝 Creating state bucket: $BUCKET"
            gsutil mb -p cricket-analytics-prod -l us-central1 gs://$BUCKET
            echo "✅ State bucket created"
          fi

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init -upgrade \
            -backend-config="bucket=cricket-analytics-prod-tfstate" \
            -backend-config="prefix=terraform/state"

      - name: 📋 Terraform Plan
        working-directory: infrastructure/terraform
        id: plan
        run: |
          echo "🔍 Running Terraform plan for PRODUCTION environment..."
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -no-color

      - name: 📤 Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: infrastructure/terraform/tfplan
          retention-days: 7

      - name: 📊 Show Plan Summary
        working-directory: infrastructure/terraform
        run: |
          echo "📋 Terraform Plan Summary:"
          terraform show tfplan | head -100

  # ============= TERRAFORM APPLY =============
  apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 📍 Initialize Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init -upgrade \
            -backend-config="bucket=cricket-analytics-prod-tfstate" \
            -backend-config="prefix=terraform/state"

      - name: 📥 Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: infrastructure/terraform/

      - name: 🔄 Import Existing GCS Buckets (if needed)
        working-directory: infrastructure/terraform
        run: |
          echo "🔄 Checking for existing GCS buckets to import..."

          # Function to import bucket if not in state
          import_bucket_if_exists() {
            local bucket=$1
            local resource=$2

            if gsutil ls -b gs://$bucket &>/dev/null; then
              if ! terraform state show google_storage_bucket.$resource &>/dev/null; then
                echo "📥 Importing bucket: $bucket"
                terraform import google_storage_bucket.$resource $bucket || echo "Already in state"
              else
                echo "✅ Bucket already in state: $bucket"
              fi
            fi
          }

          import_bucket_if_exists "cricket-raw-data-prod" "raw_data"
          import_bucket_if_exists "cricket-dataflow-templates-prod" "templates"
          import_bucket_if_exists "cricket-dataflow-temp-prod" "temp"

      - name: 🚀 Terraform Apply
        working-directory: infrastructure/terraform
        run: |
          echo "🚀 Applying Terraform plan for PRODUCTION environment..."
          terraform apply -auto-approve tfplan
          echo "✅ Infrastructure deployed successfully"

      - name: 📊 Show Outputs
        working-directory: infrastructure/terraform
        run: |
          echo "📊 Deployment Outputs:"
          terraform output -json | jq .

  # ============= HEALTH CHECKS =============
  health-checks:
    name: 🏥 Health Checks
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_GCP_CREDENTIALS_JSON }}

      - name: ☁️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 📋 Set Project ID
        run: |
          gcloud config set project ${{ secrets.PROD_GCP_PROJECT_ID }}

      - name: 📊 Verify BigQuery Datasets
        run: |
          echo "✅ Verifying BigQuery datasets in PRODUCTION..."
          bq ls --project_id=${{ secrets.PROD_GCP_PROJECT_ID }}
          echo "✅ Datasets verified"

      - name: 🪣 Verify GCS Buckets
        run: |
          echo "✅ Verifying GCS buckets in PRODUCTION..."
          gsutil ls gs://cricket-raw-data-prod
          gsutil ls gs://cricket-dataflow-templates-prod
          gsutil ls gs://cricket-dataflow-temp-prod
          echo "✅ Buckets verified"

      - name: 🔐 Verify IAM Permissions
        run: |
          echo "✅ Verifying IAM roles..."
          gcloud iam service-accounts list --filter="displayName:cricket" --format="value(email)"
          echo "✅ IAM verified"

  # ============= NOTIFY RESULTS =============
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [health-checks]
    if: always()
    steps:
      - name: ✅ Success Notification
        if: success()
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL! 🎉"
          echo ""
          echo "📦 Release: release-$VERSION"
          echo "📊 Deployment Summary:"
          echo "  • Environment: PRODUCTION"
          echo "  • Version: release-$VERSION"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "✅ Cricket Analytics Pipeline is LIVE!"
          echo ""

      - name: ❌ Failure Notification
        if: failure()
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          echo "❌ PRODUCTION DEPLOYMENT FAILED ❌"
          echo ""
          echo "📦 Release: release-$VERSION"
          echo "📊 Failure Summary:"
          echo "  • Environment: PRODUCTION"
          echo "  • Version: release-$VERSION"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "🔍 Check the logs above for details"
          exit 1

  # ============= RELEASE NOTES =============
  release:
    name: 📝 Release Notes
    runs-on: ubuntu-latest
    needs: notify
    if: success()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/release-}
          PREV_VERSION=$(git describe --tags --abbrev=0 release-$VERSION^ 2>/dev/null || echo "")

          echo "📝 Release Notes for release-$VERSION"
          echo "================================"
          if [ -n "$PREV_VERSION" ]; then
            echo "Changes since $PREV_VERSION:"
            git log $PREV_VERSION..release-$VERSION --oneline
          else
            echo "Initial production release"
          fi

      - name: 🚀 Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            🎉 **PRODUCTION Deployment Successful** 🎉

            Version: ${{ github.ref_name }}

            ✅ All validations passed
            ✅ Infrastructure deployed
            ✅ Health checks passed

            **Cricket Analytics Pipeline is LIVE in PRODUCTION**
          draft: false
          prerelease: false
